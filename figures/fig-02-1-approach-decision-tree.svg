<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1050" role="img" aria-label="Choose an approach that fits the work">
  <title>Choose an approach that fits the work</title>
  <rect x="0" y="0" width="960" height="1050" fill="white" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#142E40" />
    </marker>
  </defs>
  <text x="48" y="64" font-size="36" font-family="system-ui, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="start" fill="#142E40">Choose an approach that fits the work</text>
  <rect x="160" y="110" width="740" height="128" rx="10" fill="#F1F5F8" stroke="#0072B2" stroke-width="2" />
  <text x="530.0" y="160.0" font-size="32" font-family="system-ui, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle" fill="#142E40">Assess uncertainty, feedback,</text>
  <text x="530.0" y="208.0" font-size="32" font-family="system-ui, Segoe UI, Arial, sans-serif" font-weight="400" text-anchor="middle" fill="#142E40">delivery constraints and governance</text>
  <line x1="98" y1="174" x2="98" y2="870" stroke="#142E40" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow)" />
  <line x1="160" y1="174" x2="98" y2="174" stroke="#142E40" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow)" />
  <line x1="98" y1="364" x2="155" y2="364" stroke="#142E40" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow)" />
  <rect x="160" y="300" width="740" height="128" rx="10" fill="#F1F5F8" stroke="#0072B2" stroke-width="2" />
  <text x="530.0" y="350.0" font-size="32" font-family="system-ui, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle" fill="#142E40">Stable work; changes assessed</text>
  <text x="530.0" y="398.0" font-size="32" font-family="system-ui, Segoe UI, Arial, sans-serif" font-weight="400" text-anchor="middle" fill="#142E40">Predictive · planned deliveries</text>
  <line x1="98" y1="594" x2="155" y2="594" stroke="#142E40" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow)" />
  <rect x="160" y="530" width="740" height="128" rx="10" fill="#F1F5F8" stroke="#0072B2" stroke-width="2" />
  <text x="530.0" y="580.0" font-size="32" font-family="system-ui, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle" fill="#142E40">Evolving work; feedback can guide it</text>
  <text x="530.0" y="628.0" font-size="32" font-family="system-ui, Segoe UI, Arial, sans-serif" font-weight="400" text-anchor="middle" fill="#142E40">Adaptive · learn through increments</text>
  <line x1="98" y1="824" x2="155" y2="824" stroke="#142E40" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow)" />
  <rect x="160" y="760" width="740" height="128" rx="10" fill="#F1F5F8" stroke="#0072B2" stroke-width="2" />
  <text x="530.0" y="810.0" font-size="32" font-family="system-ui, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle" fill="#142E40">Stable and evolving components</text>
  <text x="530.0" y="858.0" font-size="32" font-family="system-ui, Segoe UI, Arial, sans-serif" font-weight="400" text-anchor="middle" fill="#142E40">Hybrid · combine approaches</text>
  <text x="48" y="958" font-size="32" font-family="system-ui, Segoe UI, Arial, sans-serif" font-weight="400" text-anchor="start" fill="#142E40">Regulation can apply to every approach.</text>
  <text x="48" y="1004" font-size="32" font-family="system-ui, Segoe UI, Arial, sans-serif" font-weight="400" text-anchor="start" fill="#142E40">This is a fit check, not an automatic rule.</text>
</svg>
