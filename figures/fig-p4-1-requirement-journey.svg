<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1270" role="img" aria-label="A requirement's journey">
  <title>A requirement's journey</title>
  <rect x="0" y="0" width="960" height="1270" fill="white" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#142E40" />
    </marker>
  </defs>
  <text x="48" y="64" font-size="36" font-family="system-ui, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="start" fill="#142E40">A requirement's journey</text>
  <rect x="150" y="110" width="744" height="148" rx="10" fill="#F1F5F8" stroke="#0072B2" stroke-width="2" />
  <text x="522.0" y="170.0" font-size="32" font-family="system-ui, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle" fill="#142E40">Identify stakeholders</text>
  <text x="522.0" y="218.0" font-size="32" font-family="system-ui, Segoe UI, Arial, sans-serif" font-weight="400" text-anchor="middle" fill="#142E40">Understand needs and decision authority</text>
  <line x1="522" y1="258" x2="522" y2="304" stroke="#142E40" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow)" />
  <rect x="150" y="314" width="744" height="148" rx="10" fill="#F1F5F8" stroke="#0072B2" stroke-width="2" />
  <text x="522.0" y="374.0" font-size="32" font-family="system-ui, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle" fill="#142E40">Elicit requirements</text>
  <text x="522.0" y="422.0" font-size="32" font-family="system-ui, Segoe UI, Arial, sans-serif" font-weight="400" text-anchor="middle" fill="#142E40">Use interviews, workshops or observation</text>
  <line x1="522" y1="462" x2="522" y2="508" stroke="#142E40" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow)" />
  <rect x="150" y="518" width="744" height="148" rx="10" fill="#F1F5F8" stroke="#0072B2" stroke-width="2" />
  <text x="522.0" y="578.0" font-size="32" font-family="system-ui, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle" fill="#142E40">Document and trace</text>
  <text x="522.0" y="626.0" font-size="32" font-family="system-ui, Segoe UI, Arial, sans-serif" font-weight="400" text-anchor="middle" fill="#142E40">Connect need, requirement and evidence</text>
  <line x1="522" y1="666" x2="522" y2="712" stroke="#142E40" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow)" />
  <rect x="150" y="722" width="744" height="148" rx="10" fill="#F1F5F8" stroke="#0072B2" stroke-width="2" />
  <text x="522.0" y="782.0" font-size="32" font-family="system-ui, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle" fill="#142E40">Communicate and refine</text>
  <text x="522.0" y="830.0" font-size="32" font-family="system-ui, Segoe UI, Arial, sans-serif" font-weight="400" text-anchor="middle" fill="#142E40">Confirm understanding; assess changes</text>
  <line x1="522" y1="870" x2="522" y2="916" stroke="#142E40" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow)" />
  <rect x="150" y="926" width="744" height="148" rx="10" fill="#F1F5F8" stroke="#0072B2" stroke-width="2" />
  <text x="522.0" y="986.0" font-size="32" font-family="system-ui, Segoe UI, Arial, sans-serif" font-weight="600" text-anchor="middle" fill="#142E40">Validate through delivery</text>
  <text x="522.0" y="1034.0" font-size="32" font-family="system-ui, Segoe UI, Arial, sans-serif" font-weight="400" text-anchor="middle" fill="#142E40">Check acceptance criteria and value</text>
  <line x1="66" y1="1000" x2="66" y2="184" stroke="#142E40" stroke-width="2" stroke-dasharray="10 7" marker-end="url(#arrow)" />
  <line x1="150" y1="1000" x2="66" y2="1000" stroke="#142E40" stroke-width="2" stroke-dasharray="10 7" marker-end="url(#arrow)" />
  <line x1="66" y1="184" x2="140" y2="184" stroke="#142E40" stroke-width="2" stroke-dasharray="10 7" marker-end="url(#arrow)" />
  <text x="48" y="1190" font-size="32" font-family="system-ui, Segoe UI, Arial, sans-serif" font-weight="400" text-anchor="start" fill="#142E40">Feedback can revisit earlier work.</text>
  <text x="48" y="1238" font-size="32" font-family="system-ui, Segoe UI, Arial, sans-serif" font-weight="400" text-anchor="start" fill="#142E40">Traceability continues across the whole journey.</text>
</svg>
